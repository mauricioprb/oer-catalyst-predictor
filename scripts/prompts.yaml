prompts:
  - nome: "dispersos_finos"
    descricao: "Poucos nanofios finos e compridos, bem separados"
    quantidade: 150
    largura: 1024
    altura: 768
    nanofios:
      quantidade: [5, 18]
      comprimento: [200, 550]
      diametro: [1, 3]
      brilho: [170, 240]
      ondulacao: 0.005
      orientacao: null
      efeito_borda: true
      catalise_ponta: true
      sombra: true
      clusters: 0
    substrato:
      brilho: [50, 100]
      textura: "liso"
      ruido: [4, 8]
      gradiente: 8
      salt_pepper: 0.001
    particulas:
      ativo: true
      quantidade: [3, 10]
      raio: [1, 3]
      brilho: [130, 200]
    barra_info:
      ativo: true
      probabilidade: 0.35
    pos_processamento:
      blur: { probabilidade: 0.2, kernels: [3] }
      ruido_detector: [2, 4]
      contraste: [0.9, 1.1]
      brilho_ajuste: [-5, 5]

  - nome: "alinhados_denso"

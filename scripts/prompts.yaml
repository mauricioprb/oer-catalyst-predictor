      textura: "granular"
      escala_grao: 24
      ruido: [6, 12]
      gradiente: 10
      salt_pepper: 0.002
    particulas:
      ativo: true
      quantidade: [5, 15]
      raio: [1, 3]
      brilho: [140, 210]
    barra_info:
      ativo: true
      probabilidade: 0.3
    pos_processamento:
      blur: { probabilidade: 0.15, kernels: [3] }
      ruido_detector: [3, 6]
      contraste: [0.85, 1.15]
      brilho_ajuste: [-8, 8]

